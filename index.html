<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stovekraft Service CRM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --bg:#FFFFFF; --panel:#FFFFFF; --border:#E5E5E5; --ink:#1A1A1A; --ink-soft:#5F5F5F; --ink-faint:#9A9A9A;
    --red:#B91C2E; --red-soft:#FBE9EA; --green:#1F8A4C; --green-soft:#E7F6ED; --amber:#B4761F; --amber-soft:#FBF0DF;
    --blue:#2457C5; --blue-soft:#EAF0FE; --grey-soft:#F2F2F2; --sap:#0F62B0; --sap-soft:#E7F0FA;
    --sidebar:#F8F8F8; --sidebar-border:#E5E5E5; --sidebar-active:#FFFFFF; --sidebar-ink:#3A3A3A; --sidebar-ink-active:#B91C2E;
    --radius:9px; --sidebar-w:236px; --sidebar-w-collapsed:64px;
    box-sizing:border-box;
  }
  :root[data-theme="dark"]{
    --bg:#121212; --panel:#1A1A1A; --border:#2E2E2E; --ink:#F0F0F0; --ink-soft:#ACACAC; --ink-faint:#6E6E6E;
    --red:#E0576A; --red-soft:#331A1E; --green:#4FBE85; --green-soft:#16281D; --amber:#D79A45; --amber-soft:#2A2113;
    --blue:#7FA3E8; --blue-soft:#182238; --grey-soft:#232323; --sap:#6FA8DC; --sap-soft:#152234;
    --sidebar:#171717; --sidebar-border:#2A2A2A; --sidebar-active:#232323; --sidebar-ink:#B7B7B7; --sidebar-ink-active:#E0576A;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100%;overflow-x:hidden;}
  ::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
  svg.ic{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  /* SIDEBAR */
  .sidebar{width:var(--sidebar-w);background:var(--sidebar);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;height:100vh;height:100dvh;position:fixed;top:0;left:0;z-index:20;padding-top:env(safe-area-inset-top,0px);transition:width .18s ease;overflow:hidden;}
  .sidebar.collapsed{width:var(--sidebar-w-collapsed);}
  .brand{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 16px;border-bottom:1px solid var(--sidebar-border);min-height:56px;overflow:hidden;}
  .brand-logo{height:30px;width:auto;max-width:100%;object-fit:contain;}
  .sidebar.collapsed .brand{padding:16px 8px;justify-content:center;}
  .brand-mark{width:28px;height:28px;border-radius:7px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 auto;}
  .brand-text{overflow:hidden;white-space:nowrap;}
  .brand-text b{display:block;font-size:13.5px;color:var(--ink);}
  .brand-text span{font-size:10.5px;color:var(--ink-faint);}
  .sidebar.collapsed .brand-text{display:none;}

  .newticket-btn{margin:12px 12px 6px;padding:10px;border-radius:8px;background:var(--red);color:#fff;text-align:center;font-weight:700;font-size:13px;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;overflow:hidden;}
  .sidebar.collapsed .newticket-btn{padding:10px 0;margin:12px 8px 6px;}
  .sidebar.collapsed .newticket-btn span{display:none;}

  .nav{padding:8px 8px;flex:1;overflow-y:auto;overflow-x:hidden;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;color:var(--sidebar-ink);margin-bottom:2px;white-space:nowrap;overflow:hidden;}
  .nav-item:hover{background:var(--sidebar-active);}
  .nav-item.active{background:var(--sidebar-active);color:var(--sidebar-ink-active);box-shadow:0 0 0 1px var(--sidebar-border);}
  .nav-item.active svg.ic{color:var(--sidebar-ink-active);}
  .sidebar.collapsed .nav-item{justify-content:center;padding:10px 0;}
  .sidebar.collapsed .nav-item span.lbl{display:none;}

  .sidebar-foot{padding:10px 8px;border-top:1px solid var(--sidebar-border);display:flex;flex-direction:column;gap:2px;}
  .foot-btn{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--sidebar-ink);white-space:nowrap;overflow:hidden;}
  .foot-btn:hover{background:var(--sidebar-active);}
  .sidebar.collapsed .foot-btn{justify-content:center;padding:9px 0;}
  .sidebar.collapsed .foot-btn span.lbl{display:none;}
  .theme-row{display:flex;align-items:center;justify-content:space-between;padding:6px 11px;}
  .sidebar.collapsed .theme-row{display:none;}
  .switch{position:relative;width:36px;height:20px;border-radius:20px;background:var(--border);cursor:pointer;flex:0 0 auto;}
  .switch.on{background:var(--red);}
  .switch-dot{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s ease;}
  .switch.on .switch-dot{left:18px;}

  /* MAIN */
  .main{margin-left:var(--sidebar-w);min-width:0;display:flex;flex-direction:column;min-height:100vh;transition:margin-left .18s ease;}
  .sidebar.collapsed ~ .main{margin-left:var(--sidebar-w-collapsed);}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 26px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:5;gap:12px;flex-wrap:wrap;}
  .topbar h1{margin:0;font-size:17px;font-weight:800;}
  .topbar .sub{font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .content{padding:22px 26px 60px;}
  .role-switch{display:flex;align-items:center;gap:8px;}
  .role-switch label{font-size:11px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .role-switch select{font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 10px;border-radius:7px;border:1.5px solid var(--red);background:var(--panel);color:var(--red);}

  .btn{border:1px solid var(--border);background:var(--panel);color:var(--ink);font-family:inherit;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
  .btn:hover{border-color:var(--red);}
  .btn-primary{background:var(--red);border-color:var(--red);color:#fff;}
  .btn-primary:hover{opacity:.9;}
  .btn-sm{padding:6px 11px;font-size:12px;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  .kpi-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px;}
  @media (max-width:1000px){.kpi-strip{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:560px){.kpi-strip{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;}
  .kpi b{display:block;font-size:19px;}
  .kpi span{font-size:10.5px;color:var(--ink-faint);font-weight:600;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
  .card h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

  table.list{width:100%;border-collapse:collapse;font-size:13px;}
  table.list th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--ink-faint);padding:0 8px 9px;border-bottom:1px solid var(--border);font-weight:700;}
  table.list td{padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
  table.list tr:last-child td{border-bottom:none;}
  table.list tr.clickable{cursor:pointer;}
  table.list tr.clickable:hover{background:var(--grey-soft);}

  .tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;display:inline-block;white-space:nowrap;}
  .tag.green{background:var(--green-soft);color:var(--green);}
  .tag.amber{background:var(--amber-soft);color:var(--amber);}
  .tag.grey{background:var(--grey-soft);color:var(--ink-faint);}
  .tag.red{background:var(--red-soft);color:var(--red);}
  .tag.blue{background:var(--blue-soft);color:var(--blue);}
  .tag.sap{background:var(--sap-soft);color:var(--sap);}
  .tag.clappia{background:#EAF6EE;color:#1F8A4C;}
  :root[data-theme="dark"] .tag.clappia{background:#152A1E;color:#4FBE85;}

  .back-link{font-size:12.5px;color:var(--ink-soft);cursor:pointer;font-weight:600;margin-bottom:12px;display:inline-flex;align-items:center;gap:5px;}
  .back-link:hover{color:var(--red);}
  .detail-title{font-size:19px;font-weight:800;}
  .detail-sub{font-size:12.5px;color:var(--ink-faint);margin-top:2px;}

  .meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media (max-width:760px){.meta-grid{grid-template-columns:repeat(2,1fr);}}
  .meta-item .l{font-size:10.5px;color:var(--ink-faint);font-weight:600;}
  .meta-item .v{font-size:13px;font-weight:600;margin-top:2px;}

  .macro-stepper{display:flex;gap:0;margin-bottom:18px;flex-wrap:wrap;}
  .macro-step{flex:1;min-width:110px;text-align:center;padding:9px 6px;font-size:10.5px;font-weight:700;border-bottom:3px solid var(--border);color:var(--ink-faint);}
  .macro-step.done{border-color:var(--green);color:var(--green);}
  .macro-step.current{border-color:var(--red);color:var(--red);}

  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:600px){.field-grid{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11.5px;font-weight:600;color:var(--ink-soft);}
  .field select,.field input,.field textarea{font-family:inherit;font-size:13px;padding:8px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--ink);width:100%;}
  .field textarea{resize:vertical;min-height:56px;}
  .required-star{color:var(--red);}

  .outcome-row{display:flex;flex-wrap:wrap;gap:8px;}
  .outcome-btn{padding:9px 13px;border-radius:7px;border:1px solid var(--border);background:var(--panel);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);}
  .outcome-btn:hover{border-color:var(--red);}
  .outcome-btn.replacement{border-color:var(--amber);color:var(--amber);}
  .outcome-btn.cancel{border-color:var(--ink-faint);color:var(--ink-faint);}

  .stepflow{display:flex;flex-direction:column;}
  .sf-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--border);align-items:flex-start;}
  .sf-row:last-child{border-bottom:none;}
  .sf-dot{width:20px;height:20px;border-radius:50%;background:var(--grey-soft);border:2px solid var(--border);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--ink-faint);margin-top:1px;}
  .sf-row.done .sf-dot{background:var(--green);border-color:var(--green);color:#fff;}
  .sf-row.current .sf-dot{background:var(--red);border-color:var(--red);color:#fff;}
  .sf-body{flex:1;min-width:0;}
  .sf-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .sf-row.pending .sf-title{color:var(--ink-faint);font-weight:600;}
  .sf-meta{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
  .sf-action{margin-top:8px;}

  .subnote{background:var(--amber-soft);color:var(--amber);border-radius:7px;padding:9px 11px;font-size:12px;font-weight:600;margin-bottom:12px;}
  .sap-note{background:var(--sap-soft);color:var(--sap);border-radius:7px;padding:9px 11px;font-size:12px;font-weight:600;margin-top:8px;display:flex;gap:7px;align-items:flex-start;}
  .clap-note{background:#EAF6EE;color:#1F8A4C;border-radius:7px;padding:9px 11px;font-size:12px;font-weight:600;margin-top:8px;display:flex;gap:7px;align-items:flex-start;}
  :root[data-theme="dark"] .clap-note{background:#152A1E;color:#4FBE85;}
  .sap-badge{background:var(--sap);color:#fff;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:4px;flex:0 0 auto;margin-top:1px;}
  .clap-badge{background:#1F8A4C;color:#fff;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:4px;flex:0 0 auto;margin-top:1px;}
  .waiting-block{border:1.5px dashed var(--border);border-radius:7px;padding:9px 11px;font-size:12px;color:var(--ink-faint);font-weight:600;margin-top:8px;}

  .log-list{display:flex;flex-direction:column;gap:0;}
  .log-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .log-item:last-child{border-bottom:none;}
  .log-ts{color:var(--ink-faint);font-size:11px;margin-right:8px;}

  .pin-box{position:relative;width:100%;max-width:280px;height:140px;background:var(--bg);border:1.5px dashed var(--border);border-radius:8px;cursor:crosshair;overflow:hidden;}
  .pin-box svg{width:100%;height:100%;}
  .pin-dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid #fff;box-shadow:0 0 0 1px var(--red);transform:translate(-50%,-50%);pointer-events:none;}
  .pin-dot.tech{background:var(--blue);box-shadow:0 0 0 1px var(--blue);}
  .pin-hint{font-size:11px;color:var(--ink-faint);margin-top:5px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(20,14,12,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--panel);border-radius:12px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:24px 26px;}
  .modal h2{margin:0 0 4px;font-size:18px;font-weight:800;}
  .modal .sub{font-size:12.5px;color:var(--ink-faint);margin-bottom:16px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  .modal-embed{max-width:920px;width:100%;height:88vh;max-height:88vh;padding:0;display:flex;flex-direction:column;overflow:hidden;}
  .modal-embed-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);flex:0 0 auto;}
  .modal-embed-head h2{margin:0;font-size:16px;}
  .modal-embed-frame{flex:1 1 auto;width:100%;border:0;background:#fff;}
  @media (max-width:640px){.modal-embed{height:94vh;max-height:94vh;border-radius:0;}}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 17px;border-radius:8px;font-size:12.5px;font-weight:600;transition:all .25s ease;pointer-events:none;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-faint);font-size:13px;}

  .subtabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);}
  .subtab{padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--ink-faint);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .subtab.active{color:var(--red);border-color:var(--red);}

  .bar-row{margin-bottom:12px;}
  .bar-label{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:5px;}
  .bar-track{height:9px;background:var(--grey-soft);border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--red);border-radius:5px;}

  .code-block{background:var(--grey-soft);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:ui-monospace,'SF Mono',Consolas,monospace;font-size:11.5px;line-height:1.6;overflow-x:auto;white-space:pre;max-height:340px;overflow-y:auto;}
  .segctrl{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .seg{padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink-soft);background:var(--panel);}
  .seg.active{background:var(--red);color:#fff;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}

  @media (max-width:860px){
    body{}
    .sidebar{width:100%;height:auto;position:relative;}
    .sidebar.collapsed{width:100%;}
    .main{margin-left:0;}
    .sidebar.collapsed ~ .main{margin-left:0;}
    .nav{display:flex;overflow-x:auto;gap:6px;}
    .nav-item{flex:0 0 auto;}
    .sidebar-foot{display:none;}
  }
</style>
</head>

function catalogFor(brand){ return PRODUCT_CATALOG[brand] || []; }
function getCatalogEntry(brand, productName){ return catalogFor(brand).find(p=>p.name===productName) || null; }
function getWarrantyStatus(ticket){
  const entry = getCatalogEntry(ticket.brand, ticket.product);
  if(!entry || !ticket.purchaseDate) return null;
  const purchase = new Date(ticket.purchaseDate);
  if(isNaN(purchase.getTime())) return null;
  const expiry = new Date(purchase);
  expiry.setMonth(expiry.getMonth() + entry.warrantyMonths);
  return { active: Date.now() <= expiry.getTime(), expiry, warrantyMonths: entry.warrantyMonths, purchase };
}

/* ===== LIVE-WIRED: Service Ticket submissions (Clappia getSubmissions) =====
   appId LEB315123 is the "Service Ticket" app tickets are read from. Anything
   Clappia doesn't know about — stage, technician assignment, appointment,
   pincode → service-centre mapping, closure workflow — stays entirely local
   to this file (see clappiaLookupPincode / allocateAuto / the closure funcs
   below); only the raw intake fields on each ticket come from Clappia. */
const CLAPPIA_API_BASE = 'https://api-public-v4.clappia.com';
const CLAPPIA_API_KEY = 'sto58073650c09f259d0b409aa55103df2ad0189f';
const CLAPPIA_TICKETS_APP_ID = 'LEB315123';

/* Every ticket on this page is a live Clappia submission. Pages are
   followed with lastSubmissionId until metadata.totalCount is reached.
   Stage, technician, appointment, closure, and pincode → service-centre
   mapping are not in Clappia — they stay in this file. */
async function clappiaFetchAllSubmissions(){
  const pageSize = 100;
  const all = [];
  const seen = new Set();
  let lastSubmissionId = null;
  for(let page = 0; page < 100; page++){
    const body = { appId: CLAPPIA_TICKETS_APP_ID, forward: true, pageSize };
    if(lastSubmissionId) body.lastSubmissionId = lastSubmissionId;
    const res = await fetch(CLAPPIA_API_BASE + '/submissions/getSubmissions', {
      method: 'POST',
      headers: { 'x-api-key': CLAPPIA_API_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if(!res.ok) throw new Error('getSubmissions HTTP ' + res.status);
    const data = await res.json();
    const subs = (data && data.submissions) || [];
    subs.forEach(s => {
      const id = s && s.submissionId;
      if(id && seen.has(id)) return;
      if(id) seen.add(id);
      all.push(s);
    });
    const total = data && data.metadata && data.metadata.totalCount;
    if(!subs.length) break;
    if(typeof total === 'number' && all.length >= total) break;
    if(!data.lastSubmissionId || data.lastSubmissionId === lastSubmissionId) break;
    if(subs.length < pageSize) break;
    lastSubmissionId = data.lastSubmissionId;
  }
  return all;
}

function fmtClappiaTime(ms){
  const d = new Date(Number(ms));
  if(!ms || isNaN(d.getTime())) return null;
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}

/* Turns one Clappia submission into the ticket-definition shape makeTicket()
   expects. Field names are Clappia's truncated fieldNames (customer_n,
   customer_t, intake_cha, customer_p, complaint_, ticket_typ, pin_code,
   serial_num, branch_nam) on the Service Ticket app. */
function mapSubmissionToTicketDef(sub){
  const fv = (sub && sub.submissionFieldValues) || {};
  const val = (key) => (fv[key] && fv[key][0]) || '';
  const brand = canonicalBrand(val('brand')) || 'Pigeon';
  const product = val('product') || '';
  const entry = getCatalogEntry(brand, product);
  const customerTypeRaw = (val('customer_t') || 'Consumer').toLowerCase();
  const customerType = ['consumer','dealer','distributor'].includes(customerTypeRaw) ? customerTypeRaw : 'consumer';
  const isEnquiry = /enquiry/i.test(val('ticket_typ'));
  const createdAt = fmtClappiaTime(sub && sub.createdAt);
  const createdDate = sub && sub.createdAt ? new Date(Number(sub.createdAt)) : null;
  return {
    ticketType: isEnquiry ? 'enquiry' : 'registered',
    customerType,
    customerName: val('customer_n') || 'Customer',
    phone: val('customer_p') || '',
    intakeChannel: INTAKE_CHANNELS.includes(val('intake_cha')) ? val('intake_cha') : 'Call Centre',
    brand, product,
    model: entry ? entry.material : product,
    serial: val('serial_num') || '',
    pincode: val('pin_code') || '',
    purchaseDate: null,
    purchaseChannel: null,
    complaint: val('complaint_') || '',
    locationPin: null,
    branchNameFromClappia: val('branch_nam') || null,
    clappiaSubmissionId: sub.submissionId || null,
    createdAt: createdAt,
    createdAtISO: createdDate && !isNaN(createdDate.getTime()) ? createdDate.toISOString() : null,
  };
}

function applyIntakeFromDef(t, def){
  t.ticketType = def.ticketType;
  t.customerType = def.customerType;
  t.customerName = def.customerName;
  t.phone = def.phone;
  t.intakeChannel = def.intakeChannel;
  t.brand = canonicalBrand(def.brand) || def.brand || 'Pigeon';
  t.product = def.product;
  t.model = def.model;
  t.serial = def.serial;
  t.pincode = def.pincode;
  t.complaint = def.complaint;
  t.clappiaSubmissionId = def.clappiaSubmissionId;
}

async function materialiseTickets(defs, { fresh }){
  const prior = fresh ? [] : (state.tickets || []);
  const bySub = new Map();
  prior.forEach(t => { if(t.clappiaSubmissionId) bySub.set(t.clappiaSubmissionId, t); });
  const next = [];
  const keptIds = new Set();
  for(const def of defs){
    let t = bySub.get(def.clappiaSubmissionId);
    if(t && !fresh){
      const pinChanged = String(t.pincode || '') !== String(def.pincode || '');
      applyIntakeFromDef(t, def);
      if(pinChanged && !t.technician && !t.visitOutcome && !t.replacement && !t.closure){
        await allocateAuto(t);
      }
    } else {
      if(!def.locationPin) def.locationPin = nextDemoPin();
      t = makeTicket(def);
      if(t.clappiaSubmissionId){
        addLog(t, 'Ticket loaded from Clappia submission ' + t.clappiaSubmissionId);
        t.log[t.log.length-1].clappia = true;
      }
      await runSeedScriptFor(t);
    }
    keptIds.add(t.id);
    next.push(t);
  }
  if(!fresh){
    prior.forEach(t => {
      if(t.linkedFromEnquiry && keptIds.has(t.linkedFromEnquiry)) next.push(t);
    });
  }
  state.tickets = next;
}

/* Pulls every Service Ticket submission and rebuilds the list from that
   response. Local stage progress is kept for submission ids we already have.
   A failed call never substitutes sample tickets. */
async function syncTicketsFromClappia(){
  ticketsLoadError = null;
  try{
    const defs = await clappiaFetchExistingTickets();
    await materialiseTickets(defs, { fresh: false });
  } catch(err){
    ticketsLoadError = (err && err.message) ? err.message : 'Could not load tickets from Clappia';
    clappiaLog('Fetch existing tickets', 'Live Clappia call failed — ' + ticketsLoadError + '. No sample tickets were loaded.');
    state.tickets = (state.tickets || []).filter(t => t.clappiaSubmissionId || t.linkedFromEnquiry);
  }
}

async function seedDemoData(){
  state = { tickets: [], counter: 1000, integrationLog: [], clappiaLog: [] };
  _nextSeedPin = 0;
  ticketsLoadError = null;
  try{
    const defs = await clappiaFetchExistingTickets();
    await materialiseTickets(defs, { fresh: true });
  } catch(err){
    ticketsLoadError = (err && err.message) ? err.message : 'Could not load tickets from Clappia';
    clappiaLog('Fetch existing tickets', 'Live Clappia call failed — ' + ticketsLoadError + '. No sample tickets were loaded.');
    state.tickets = [];
  }
}

function makeTicket(f){
  state.counter += 1;
  return {
    id: 'TCK-' + state.counter,
    ticketType: f.ticketType, customerType: f.customerType,
    customerName: f.customerName, phone: f.phone,
    product: f.product, model: f.model, serial: f.serial, brand: f.brand || 'Pigeon',
    intakeChannel: f.intakeChannel || 'Call Centre',
    priority: !!f.priority,
    pincode: f.pincode, purchaseChannel: f.purchaseChannel, complaint: f.complaint, purchaseDate: f.purchaseDate || null,
    locationPin: f.locationPin || null,
    createdAt: f.createdAt || nowStr(), createdAtISO: f.createdAtISO || new Date().toISOString(),
    mapped: null, serviceCentre: null, technician: null, appointment: null, techCheckIn: null,
    visitOutcome: null, poRaised: false, visitEvidence: null,
    replacement: null,
    enquiryClosed: false, suggestedCentreCached: null, convertedTicketId: null, linkedFromEnquiry: f.linkedFromEnquiry || null,
    closure: null,
    sapDemo: !!f.sapDemo,
    clappiaSubmissionId: f.clappiaSubmissionId || null,
    log: [],
  };
}

function nowStr(){
  const d = new Date();
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
function addLog(ticket, text, sap){ ticket.log.push({ ts: nowStr(), text, sap: sap || null }); }
function simulateSap(ticket, method, object, endpoint, payload){
  const entry = { ts: nowStr(), ticketId: ticket.id, method, object, endpoint, payload: JSON.stringify(payload) };
  state.integrationLog.push(entry);
  addLog(ticket, (method==='write'?'SAP write — ':'SAP read — ') + object, entry);
}

/* ========================= BUSINESS LOGIC ========================= */
async function allocateAuto(ticket){
  const r = await clappiaLookupPincode(ticket.pincode);
  ticket.mapped = r.mapped;
  if(r.mapped){
    ticket.serviceCentre = r.centre;
    addLog(ticket, 'Pincode ' + ticket.pincode + ' is covered — auto-allocated to ' + r.centre, null);
    ticket.log[ticket.log.length-1].clappia = true;
  } else {
    addLog(ticket, 'Pincode ' + ticket.pincode + ' is not covered — sent to branch for manual allocation');
    ticket.log[ticket.log.length-1].clappia = true;
  }
}
async function setOutcome(ticket, outcome, silent, evidenceFile){
  ticket.visitOutcome = outcome;
  if(evidenceFile) ticket.visitEvidence = evidenceFile;
  if(!silent){
    await clappiaSubmitFieldEntry(ticket.id, { outcome, evidence: evidenceFile||null });
    addLog(ticket, 'Visit outcome recorded: ' + outcomeLabel(outcome) + (evidenceFile? ' — evidence attached: '+evidenceFile : ''));
    ticket.log[ticket.log.length-1].clappia = true;
  }
  if(outcome === 'part_pending'){
    ticket.poRaised = true;
    if(!silent) simulateSap(ticket, 'write', 'Purchase Order', 'API_PURCHASEORDER_PROCESS_SRV', {Material:ticket.model, Qty:1});
  }
  if(outcome === 'replacement'){
    ticket.replacement = { completed:['initiated'], invoiceError:null };
    if(!silent) addLog(ticket, 'Replacement sub-flow started');
  }
  if(outcome === 'closed_no_part' || outcome === 'closed_with_part'){ initClosure(ticket, false); }
}
function outcomeLabel(o){
  return { closed_no_part:'Closed without a part', closed_with_part:'Closed with a part', part_pending:'Part pending — Purchase Order raised',
    cancelled:'Cancelled', revisit:'Revisit needed', replacement:'Replacement needed' }[o] || o;
}
function advanceReplacement(ticket){
  const done = ticket.replacement.completed;
  const nextIdx = done.length;
  if(nextIdx >= REPLACEMENT_STEPS.length) return;
  const step = REPLACEMENT_STEPS[nextIdx];
  done.push(step.key);
  addLog(ticket, step.label);
  if(step.key === 'closed'){ initClosure(ticket, true); }
}
function initClosure(ticket, isReplacement){
  ticket.closure = {
    isReplacementCall: !!isReplacement, closedAt: nowStr(), closedAtISO: new Date().toISOString(),
    happyCode:null, deductionApplied:null, duplicateSerialFlag:null,
    hoConfirmed:false, unbilled:false, claimAdjustment:null, invoiceUnlocked:false,
    invoiceNumber:null, invoiceDate:null, invoiceFile:null, finalApproved:false,
    defectiveReturn: isReplacement ? { rpoRaised:false, creditNoteIssued:false } : null,
    payoutIncluded:false,
  };
  addLog(ticket, 'Call closed — moved into closure & claims');
}
function runDuplicateCheck(ticket){
  const cutoff = Date.now() - 30*24*60*60*1000;
  const dup = state.tickets.some(o => {
    if(o.id === ticket.id || o.serial !== ticket.serial || !o.closure || !o.closure.closedAtISO) return false;
    return new Date(o.closure.closedAtISO).getTime() >= cutoff;
  });
  ticket.closure.duplicateSerialFlag = dup;
  addLog(ticket, dup ? 'Duplicate serial number found within 30 days — flagged for review' : 'No duplicate serial number found in the last 30 days');
}
function triggerAutoClosure(id){
  const t = state.tickets.find(x=>x.id===id);
  if(!t || !t.closure) return;
  const c = t.closure; let changed=false;
  if(c.isReplacementCall && c.deductionApplied===null){ c.deductionApplied=false; addLog(t,'Replacement call — no Happy Code deduction applies'); changed=true; }
  if(c.deductionApplied!==null && c.duplicateSerialFlag===null){ runDuplicateCheck(t); changed=true; }
  if(c.hoConfirmed && !c.unbilled){ c.unbilled = true; addLog(t,'Pushed to Unbilled Transaction queue'); changed=true; }
  if(changed){ saveState(); render(); }
}
function advanceClosure(ticket, formData){
  const c = ticket.closure;
  if(c.deductionApplied === null){
    c.happyCode = 'HC-' + Math.floor(10000+Math.random()*89999); c.deductionApplied = true;
    addLog(ticket, 'Happy Code captured: ' + c.happyCode + ' (95% deduction applied)'); return;
  }
  if(!c.claimAdjustment){
    const amt = formData ? Number(formData.get('amount')||0) : 0;
    const reason = formData ? (formData.get('reason')||'No adjustment') : 'No adjustment';
    c.claimAdjustment = { amount: amt, reason };
    addLog(ticket, 'Claim adjustment recorded: ' + (amt? (amt>0?'+':'') + amt + ' — ' + reason : 'none')); return;
  }
  if(!c.invoiceUnlocked){ c.invoiceUnlocked = true; addLog(ticket, 'Branch unlocked invoice entry for service centre'); return; }
  if(!c.invoiceNumber){
    const num = formData ? formData.get('invoiceNumber') : null;
    const date = formData ? formData.get('invoiceDate') : null;
    if(!num || !date) return;
    const file = formData ? formData.get('invoiceFile') : null;
    c.invoiceNumber = num; c.invoiceDate = date;
    if(file && file.name) c.invoiceFile = file.name;
    addLog(ticket, 'Invoice ' + num + ' submitted by service centre' + (c.invoiceFile ? (' — attached: '+c.invoiceFile) : ''));
    simulateSap(ticket, 'write', 'Billing Document', 'API_BILLING_DOCUMENT_SRV', {InvoiceNo:num, Date:date}); return;
  }
}
function approveClosureStep(ticket, step){
  const c = ticket.closure;
  if(step==='ho_confirm'){ c.hoConfirmed = true; addLog(ticket, 'Head Office confirmed the closed call'); }
  if(step==='final_approval'){
    c.finalApproved = true; addLog(ticket, 'Head Office gave final approval — ticket closed');
    if(!c.defectiveReturn) c.payoutIncluded = true;
  }
}
function rejectClosureStep(ticket, step, reason){
  const label = step==='ho_confirm' ? 'Head Office confirms' : 'Head Office final approval';
  addLog(ticket, label + ' — rejected: ' + reason);
}
function submitReplacementDocs(ticket, formData){
  const file = formData.get('file'); const notes = formData.get('notes');
  if(file && file.name) ticket.replacement.docsFile = file.name;
  if(notes) ticket.replacement.docsNotes = notes;
  advanceReplacement(ticket);
  if(file && file.name) addLog(ticket, 'Document attached: ' + file.name);
}
function approveReplacementStep(ticket){ advanceReplacement(ticket); }
function rejectReplacementStep(ticket, reason){
  const done = ticket.replacement.completed; const nextIdx = done.length;
  const step = REPLACEMENT_STEPS[nextIdx];
  addLog(ticket, (step? step.label : 'Replacement step') + ' — rejected: ' + reason);
}
/* TODO(Cursor): once SAP Mode is wired live (see note above the Clappia stubs),
   this function is where the real Material Stock read + Billing Document read
   belong — the same two calls simulated below, made for real, through Clappia. */
function attemptInvoicePull(ticket){
  const entry = getCatalogEntry(ticket.brand, ticket.product);
  const warranty = getWarrantyStatus(ticket);
  const warrantyNote = warranty ? (warranty.active ? 'covered under warranty (until '+fmtDate(warranty.expiry)+')' : 'out of warranty since '+fmtDate(warranty.expiry)+' — chargeable replacement') : 'warranty not determined — no purchase date on file';
  addLog(ticket, 'Warranty check: ' + warrantyNote);
  simulateSap(ticket, 'read', 'Material Stock', 'API_MATERIAL_STOCK_SRV', {Material: entry?entry.material:ticket.model});
  if(!entry || entry.stock <= 0){
    ticket.replacement.invoiceError = 'Inventory stock not available' + (entry ? (' for ' + entry.material) : '') + ' — cannot pull invoice yet.';
    addLog(ticket, 'Inventory check failed — stock not available for ' + (entry?entry.material:ticket.product));
    return;
  }
  entry.stock -= 1;
  ticket.replacement.invoiceError = null;
  simulateSap(ticket, 'read', 'Billing Document', 'API_BILLING_DOCUMENT_SRV', {Note:'Replacement invoice pulled', Material: entry.material, Chargeable: !(warranty&&warranty.active)});
  addLog(ticket, 'Inventory confirmed (' + (entry.stock+1) + ' → ' + entry.stock + ') — invoice pulled from SAP (' + (warranty&&warranty.active?'warranty-covered':'chargeable') + ')');
  advanceReplacement(ticket);
}
function overrideInvoiceStep(ticket){
  ticket.replacement.invoiceError = null;
  addLog(ticket, 'Invoice step marked resolved manually — bypassing inventory check');
  advanceReplacement(ticket);
}
function advanceReturn(ticket){
  const r = ticket.closure.defectiveReturn;
  if(!r.rpoRaised){ r.rpoRaised = true; addLog(ticket, 'Reverse pickup coordinated for defective unit'); return; }
  if(!r.creditNoteIssued){
    r.creditNoteIssued = true; addLog(ticket, 'Credit note issued for returned defective unit');
    simulateSap(ticket, 'write', 'Credit Memo Request', 'API_CREDIT_MEMO_REQUEST_SRV', {Reason:'Defective unit return'});
    ticket.closure.payoutIncluded = true; return;
  }
}
function closureFullyDone(t){
  if(!t.closure) return false;
  if(!t.closure.finalApproved) return false;
  if(t.closure.defectiveReturn && !t.closure.defectiveReturn.creditNoteIssued) return false;
  return true;
}

/* ========================= SHARED HELPERS ========================= */
function stageOf(t){
  if(t.ticketType==='enquiry' && !t.convertedTicketId) return 'enquiry_closed';
  if(!t.serviceCentre) return 'awaiting_allocation';
  if(!t.technician) return 'awaiting_technician';
  if(!t.appointment) return 'awaiting_appointment';
  if(!t.visitOutcome) return 'awaiting_visit';
  if(t.visitOutcome==='cancelled') return 'cancelled';
  if(t.visitOutcome==='part_pending') return 'part_pending';
  if(t.visitOutcome==='revisit') return 'revisit';
  if(t.replacement && !t.closure) return 'replacement_flow';
  if(t.closure && !closureFullyDone(t)) return 'closure_flow';
  if(t.closure && closureFullyDone(t)) return 'closed_paid';
  return 'in_progress';
}
function stageTag(t){
  const s = stageOf(t);
  const map = {
    enquiry_closed: ['grey','Enquiry closed'], awaiting_allocation:['amber','Awaiting allocation'], awaiting_technician:['blue','Awaiting technician'],
    awaiting_appointment:['blue','Awaiting appointment'], awaiting_visit:['blue','Awaiting visit'], cancelled:['grey','Cancelled'],
    part_pending:['amber','Part pending'], revisit:['amber','Revisit needed'], replacement_flow:['amber','Replacement in progress'],
    closure_flow:['blue','In closure & claims'], closed_paid:['green','Closed & paid out'], in_progress:['blue','In progress'],
  };
  const m = map[s] || ['grey', s];
  return '<span class="tag '+m[0]+'">'+m[1]+'</span>';
}
function kpiCounts(){
  const tickets = state.tickets;
  return {
    total: tickets.length,
    awaiting: tickets.filter(t=>['awaiting_allocation','awaiting_technician','awaiting_appointment','awaiting_visit'].includes(stageOf(t))).length,
    replacement: tickets.filter(t=>stageOf(t)==='replacement_flow').length,
    closure: tickets.filter(t=>stageOf(t)==='closure_flow').length,
    closed: tickets.filter(t=>stageOf(t)==='closed_paid').length,
    unmapped: tickets.filter(t=>t.mapped===false && !t.serviceCentre).length,
  };
}
function sortedDesc(tickets){
  return tickets.slice().sort((a,b) => new Date(b.createdAtISO) - new Date(a.createdAtISO));
}
function ticketRowsHtml(tickets){
  return sortedDesc(tickets).map(t => `
    <tr class="clickable" data-action="open-ticket" data-id="${t.id}">
      <td><strong>${t.id}</strong> ${t.priority?'<span class="tag red">Priority</span>':''} ${t.sapDemo?'<span class="tag sap">SAP Demo</span>':''}<div style="font-size:10.5px;color:var(--ink-faint);">${t.ticketType==='registered'?'Registered Complaint':'General Enquiry'} · ${t.intakeChannel} · ${t.createdAt}</div></td>
      <td>${t.customerName}<div style="font-size:10.5px;color:var(--ink-faint);">${t.customerType}</div></td>
      <td>${t.product}<div style="display:flex;align-items:center;gap:5px;margin-top:3px;">${brandBadge(t.brand)}</div></td>
      <td>${t.pincode} ${t.mapped===true?'<span class="tag green">Mapped</span>':t.mapped===false?'<span class="tag amber">Unmapped</span>':''}</td>
      <td>${stageTag(t)}</td>
    </tr>`).join('');
}

/* ========================= PAGE: REPORTS ========================= */
function renderReportsPage(){
  const tickets = state.tickets;
  function bars(groupFn, title){
    const counts = {};
    tickets.forEach(t=>{ const k = groupFn(t); counts[k] = (counts[k]||0)+1; });
    const max = Math.max(1, ...Object.values(counts));
    const rows = Object.entries(counts).map(([k,v])=>`
      <div class="bar-row"><div class="bar-label"><span>${k}</span><span>${v}</span></div><div class="bar-track"><div class="bar-fill" style="width:${(v/max*100).toFixed(0)}%;"></div></div></div>
    `).join('');
    return `<div class="card"><h3>${title}</h3>${rows || '<div class="empty">No data yet.</div>'}</div>`;
  }
  let html = '';
  html += bars(t=>stageTag(t).replace(/<[^>]+>/g,''), 'Tickets by stage');
  html += bars(t=>t.brand, 'Tickets by brand');
  html += bars(t=>t.intakeChannel, 'Tickets by intake channel');
  html += `<div class="card"><h3>SAP touchpoints fired</h3>${
    (()=>{ const counts={}; state.integrationLog.forEach(e=>{counts[e.object]=(counts[e.object]||0)+1;}); const max=Math.max(1,...Object.values(counts));
      return Object.entries(counts).map(([k,v])=>`<div class="bar-row"><div class="bar-label"><span>${k}</span><span>${v}</span></div><div class="bar-track"><div class="bar-fill" style="width:${(v/max*100).toFixed(0)}%;background:var(--sap);"></div></div></div>`).join('') || '<div class="empty">No SAP calls fired yet.</div>';
    })()
  }</div>`;
  return html;
}

function outcomeTagColor(o){ return { closed_no_part:'green', closed_with_part:'green', part_pending:'amber', cancelled:'grey', revisit:'amber', replacement:'amber' }[o]||'grey'; }

function renderMacroStepper(t){
  const stages = ['Intake','Registration','Allocation','Field Diagnosis','Resolution','Closure'];
  const s = stageOf(t); let idx = 0;
  if(['awaiting_technician','awaiting_appointment'].includes(s)) idx=2;
  else if(s==='awaiting_allocation') idx=2;
  else if(s==='awaiting_visit') idx=3;
  else if(['part_pending','revisit','replacement_flow'].includes(s)) idx=4;
  else if(['closure_flow','closed_paid'].includes(s)) idx=5;
  else if(s==='cancelled') idx=3;
  else idx=1;
  return `<div class="macro-stepper">${stages.map((lbl,i)=>`<div class="macro-step ${i<idx?'done':i===idx?'current':''}">${lbl}</div>`).join('')}</div>`;
}

function renderReplacementFlow(t){
  const completed = t.replacement.completed; const nextIdx = completed.length;

  REPLACEMENT_STEPS.forEach((step,i)=>{
    const role = REPLACEMENT_ROLES[step.key];
    const cls = i<nextIdx ? 'done' : (i===nextIdx?'current':'pending');
    html += `<div class="sf-row ${cls}"><div class="sf-dot">${i<nextIdx?'&#10003;':i+1}</div><div class="sf-body">
      <div class="sf-title">${step.label} ${role?roleBadge(role):''}</div>`;
    if(i<nextIdx){
      const extra = (step.key==='docs' && t.replacement.docsFile) ? (' — attached: '+t.replacement.docsFile) : '';
      html += `<div class="sf-meta">Completed${extra}</div>`;
    } else if(i===nextIdx && !step.auto){
      if(!canAct(role)){ html += waitingBlock(role); }
      else if(step.key==='docs'){
        html += `<form data-action="submit-docs-replacement" data-id="${t.id}" style="margin-top:8px;max-width:380px;">
          <div class="field"><label>Attach supporting document</label><input type="file" name="file"></div>
          <div class="field" style="margin-top:6px;"><label>Notes</label><input type="text" name="notes" placeholder="e.g. photos of the fault"></div>
          <button class="btn btn-sm btn-primary" type="submit" style="margin-top:8px;">Upload &amp; mark complete</button>
        </form>`;
      } else if(REPLACEMENT_APPROVALS.has(step.key)){
        html += `<div class="sf-action">
          <button class="btn btn-sm btn-primary" data-action="approve-replacement" data-id="${t.id}">Approve</button>
          <form data-action="reject-replacement" data-id="${t.id}" style="margin-top:8px;max-width:380px;">

            <button class="btn btn-sm" type="submit" style="margin-top:6px;">Reject with reason</button>
          </form>
        </div>`;
      } else if(step.key==='invoice_pending'){
        const entry = getCatalogEntry(t.brand, t.product);
        const warranty = getWarrantyStatus(t);
        const warrantyLine = !warranty ? 'Warranty not determined — no purchase date on file.'
          : warranty.active ? ('Warranty active until '+fmtDate(warranty.expiry)+' — replacement is covered.')
          : ('Warranty expired '+fmtDate(warranty.expiry)+' — this replacement will be chargeable.');
        if(t.replacement.invoiceError){
          html += noteStack([{type:'warn', text:warrantyLine}]);
          html += `<div style="background:var(--red-soft);color:var(--red);border-radius:8px;padding:9px 11px;font-size:12.5px;font-weight:600;margin-top:6px;">${t.replacement.invoiceError}</div>

            <button class="btn btn-sm btn-primary" data-action="check-invoice" data-id="${t.id}">Check inventory again</button>
            <button class="btn btn-sm" data-action="override-invoice" data-id="${t.id}">Override — mark resolved manually</button>
          </div>`;
        } else {
          html += noteStack([
            {type:'warn', text:warrantyLine},
            {type:'sap', text:`Checks Material Stock for ${entry?entry.material:t.product}, then pulls the replacement invoice from SAP.`},
          ]);
          html += `<div class="sf-action"><button class="btn btn-sm btn-primary" data-action="check-invoice" data-id="${t.id}">Check inventory &amp; pull invoice from SAP</button></div>`;
        }
      } else { html += `<div class="sf-action"><button class="btn btn-sm btn-primary" data-action="advance-replacement" data-id="${t.id}">Mark complete</button></div>`; }
    }
    html += `</div></div>`;
  });
  html += '</div>'; return html;
}

function renderClosureSteps(t){
  const c = t.closure;
  const order = [
    {key:'happy_code', done: c.deductionApplied!==null, label: c.isReplacementCall ? 'Happy Code step skipped (replacement call)' : 'Capture Happy Code (customer satisfaction confirmation)', meta: c.happyCode?('Code: '+c.happyCode):''},
    {key:'duplicate_check', done: c.duplicateSerialFlag!==null, label:'System checks serial number against other closed calls (last 30 days)', meta: c.duplicateSerialFlag===true?'Duplicate found — flagged':(c.duplicateSerialFlag===false?'No duplicate found':'')},
    {key:'ho_confirm', done: c.hoConfirmed, label:'Head Office confirms'},
    {key:'unbilled', done: c.unbilled, label:'Pushed to Unbilled Transaction queue'},
    {key:'claim_adjustment', done: !!c.claimAdjustment, label:'Claim adjustment recorded (add / deduct)', meta: c.claimAdjustment ? (c.claimAdjustment.amount + ' — ' + c.claimAdjustment.reason) : ''},
    {key:'invoice_unlocked', done: c.invoiceUnlocked, label:'Branch unlocks invoice entry for service centre'},
    {key:'invoice_submitted', done: !!c.invoiceNumber, label:'Service centre submits invoice number & date', meta: c.invoiceNumber ? (c.invoiceNumber+' · '+c.invoiceDate+(c.invoiceFile?(' · '+c.invoiceFile):'')) : ''},
    {key:'final_approval', done: c.finalApproved, label:'Head Office final approval'},
  ];
  const firstPendingIdx = order.findIndex(o=>!o.done);
  let html = '<div class="stepflow">';
  order.forEach((o,i)=>{
    let role = CLOSURE_ROLES[o.key]; if(o.key==='happy_code' && c.isReplacementCall) role = 'system';
    const cls = o.done ? 'done' : (i===firstPendingIdx ? 'current' : 'pending');
    html += `<div class="sf-row ${cls}"><div class="sf-dot">${o.done?'&#10003;':i+1}</div><div class="sf-body">
      <div class="sf-title">${o.label} ${roleBadge(role)}</div>
      ${o.meta ? `<div class="sf-meta">${o.meta}</div>` : ''}`;
    if(i===firstPendingIdx){
      if(role==='system'){ setTimeout(()=>{ triggerAutoClosure(t.id); }, 0); }
      else if(!canAct(role)){ html += waitingBlock(role); }
      else if(o.key==='claim_adjustment'){
        html += `<form data-action="advance-closure" data-id="${t.id}" class="field-grid" style="margin-top:8px;">
          <div class="field"><label>Amount (+ / -)</label><input type="number" name="amount" value="0"></div>
          <div class="field"><label>Reason</label><input type="text" name="reason" value="No adjustment"></div>
          <div class="field" style="grid-column:1/-1;"><button class="btn btn-sm btn-primary" type="submit">Save adjustment</button></div>
        </form>`;
      } else if(o.key==='invoice_submitted'){
        html += `<form data-action="advance-closure" data-id="${t.id}" class="field-grid" style="margin-top:8px;">
          <div class="field"><label>Invoice number</label><input type="text" name="invoiceNumber" placeholder="INV-XXXXX" required></div>
          <div class="field"><label>Invoice date</label><input type="date" name="invoiceDate" required></div>
          <div class="field" style="grid-column:1/-1;"><label>Attach invoice file</label><input type="file" name="invoiceFile"></div>
          <div class="field" style="grid-column:1/-1;"><button class="btn btn-sm btn-primary" type="submit">Submit invoice</button></div>
        </form>`;
      } else if(o.key==='happy_code'){ html += `<div class="sf-action"><button class="btn btn-sm btn-primary" data-action="advance-closure" data-id="${t.id}">Capture Happy Code</button></div>`; }
      else if(CLOSURE_APPROVALS.has(o.key)){
        html += `<div class="sf-action">
          <button class="btn btn-sm btn-primary" data-action="approve-closure" data-id="${t.id}" data-step="${o.key}">Approve</button>
          <form data-action="reject-closure" data-id="${t.id}" data-step="${o.key}" style="margin-top:8px;max-width:380px;">
            <textarea name="reason" placeholder="Reason to reject" required style="min-height:44px;"></textarea>
            <button class="btn btn-sm" type="submit" style="margin-top:6px;">Reject with reason</button>
          </form>
        </div>`;
      } else { html += `<div class="sf-action"><button class="btn btn-sm btn-primary" data-action="advance-closure" data-id="${t.id}">Confirm</button></div>`; }
    }
    html += `</div></div>`;
  });
  html += '</div>'; return html;
}

function renderReturnFlowSteps(t){
  const r = t.closure.defectiveReturn;
  const doneKeys = [r.rpoRaised && 'rpo', r.creditNoteIssued && 'credit_note'].filter(Boolean);
  let html = '<div class="stepflow">';
  RETURN_STEPS.forEach((step,i)=>{
    const role = RETURN_ROLES[step.key];
    const done = doneKeys.includes(step.key);
    const isCurrent = !done && doneKeys.length===i;
    const cls = done?'done':(isCurrent?'current':'pending');
    html += `<div class="sf-row ${cls}"><div class="sf-dot">${done?'&#10003;':i+1}</div><div class="sf-body">
      <div class="sf-title">${step.label} ${roleBadge(role)}</div>`;
    if(isCurrent){
      if(!canAct(role)){ html += waitingBlock(role); }
      else { html += `<div class="sf-action"><button class="btn btn-sm btn-primary" data-action="advance-return" data-id="${t.id}">Mark complete</button></div>`; }
    }
    html += `</div></div>`;
  });
  html += '</div>'; return html;
}

function renderLog(t){
  if(!t.log.length) return '';

  return `<div class="card"><h3>Activity log</h3><div class="log-list">${items}</div></div>`;

async function submitNewTicket(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const f = Object.fromEntries(fd.entries());
  f.locationPin = pendingPin;
  const t = makeTicket(f);

  if(f.customerType==='dealer' || f.customerType==='distributor'){
    simulateSap(t, 'read', 'Business Partner', 'API_BUSINESS_PARTNER', {CustomerType:f.customerType});
  }

  if(f.ticketType==='enquiry'){
    t.enquiryClosed = true;
    const r = await clappiaLookupPincode(t.pincode);
    t.suggestedCentreCached = r.centre || DEFAULT_CENTRE;
    addLog(t, 'General enquiry received via ' + f.purchaseChannel);
    addLog(t, 'Enquiry auto-closed — service centre address shared with customer');
  } else {
    addLog(t, 'Registered complaint created');
    simulateSap(t, 'read', 'Sales Order', 'API_SALES_ORDER_SRV', {Note:'Linked to original purchase record'});
    await allocateAuto(t);
  }

  state.tickets.push(t); saveState(); closeModal();
  activeTicketId = t.id; render();
  showToast('Ticket ' + t.id + ' created');
}

function bindEvents(){
  applyLoadBanner();
  document.querySelectorAll('[data-action]').forEach(el=>{ if(el.tagName==='FORM') return; el.onclick = handleAction; });
  document.querySelectorAll('form[data-action]').forEach(f=>{ f.onsubmit = handleFormAction; });
}
function findTicket(id){ return state.tickets.find(x=>x.id===id); }

async function handleAction(e){
  const el = e.currentTarget;
  const action = el.dataset.action;
  const id = el.dataset.id;
  if(action==='nav'){ activePage = el.dataset.page; activeTicketId=null; saveState(); render(); return; }
  if(action==='open-new-ticket'){ openNewTicketModal(); return; }
  if(action==='close-modal'){ closeNewTicketModal(); return; }
  if(action==='open-ticket'){ activeTicketId = id; render(); return; }
  if(action==='crm-subtab'){ crmSubtab = el.dataset.sub; render(); return; }
  if(action==='logs-subtab'){ logsSubtab = el.dataset.sub; render(); return; }
  if(action==='sap-mode'){ sapMode = el.dataset.mode; render(); return; }
  if(action==='toggle-theme'){ theme = theme==='dark' ? 'light' : 'dark'; saveState(); render(); return; }
  if(action==='toggle-sap-mode'){ sapMode = sapMode==='real' ? 'simulated' : 'real'; render(); return; }
  if(action==='toggle-collapse'){ sidebarCollapsed = !sidebarCollapsed; saveState(); render(); return; }
  if(action==='reset-demo'){
    if(confirm('Reset all demo data? This clears tickets you have created.')){
      await seedDemoData(); saveState(); activeTicketId=null; activePage='dashboard'; currentRole='all'; render(); showToast('Demo data reset');
    } return;
  }
  if(action==='convert-enquiry'){
    if(!canAct('asc')) return;
    const t = findTicket(id);
    const wt = makeTicket({ ticketType:'registered', customerType:t.customerType, customerName:t.customerName, phone:t.phone,
      product:t.product, model:t.product, serial:t.serial, pincode:t.pincode, purchaseChannel:t.purchaseChannel,
      complaint:t.complaint, locationPin:t.locationPin, linkedFromEnquiry:t.id, intakeChannel:t.intakeChannel, brand:t.brand });
    wt.mapped = true; wt.serviceCentre = t.suggestedCentreCached || DEFAULT_CENTRE;
    addLog(wt, 'Workshop Ticket opened directly at ' + wt.serviceCentre + ' (converted from enquiry ' + t.id + ')');
    state.tickets.push(wt); t.convertedTicketId = wt.id;
    addLog(t, 'Converted to Workshop Ticket ' + wt.id);
    saveState(); activeTicketId = wt.id; render(); showToast('Workshop Ticket ' + wt.id + ' created'); return;
  }
  if(action==='tech-checkin'){
    if(!canAct('technician')) return;
    const t = findTicket(id);
    const base = t.locationPin || {x:130,y:70};
    t.techCheckIn = { x: base.x + (Math.random()*30-15), y: base.y + (Math.random()*30-15) };
    addLog(t, 'Technician checked in on-site');
    saveState(); render(); return;
  }
  if(action==='set-outcome'){
    if(!canAct('technician')) return;
    const t = findTicket(id);
    const evEl = document.getElementById('evidenceFile');
    const evidenceFile = (evEl && evEl.files && evEl.files[0]) ? evEl.files[0].name : null;
    await setOutcome(t, el.dataset.outcome, false, evidenceFile);
    saveState(); render(); return;
  }
  if(action==='part-received'){
    if(!canAct('asc')) return;
    const t = findTicket(id);
    t.appointment = null; t.techCheckIn = null; t.visitOutcome = null;
    addLog(t, 'Part received — visit rescheduled'); saveState(); render(); return;
  }
  if(action==='schedule-revisit'){
    if(!canAct('branch')) return;
    const t = findTicket(id);
    t.appointment = null; t.techCheckIn = null; t.visitOutcome = null;
    addLog(t, 'Revisit — rescheduling appointment'); saveState(); render(); return;
  }
  if(action==='advance-replacement'){
    const t = findTicket(id);
    const nextStep = REPLACEMENT_STEPS[t.replacement.completed.length];
    if(nextStep && !canAct(REPLACEMENT_ROLES[nextStep.key])) return;
    advanceReplacement(t); saveState(); render(); return;
  }
  if(action==='approve-replacement'){
    const t = findTicket(id);
    const nextStep = REPLACEMENT_STEPS[t.replacement.completed.length];
    if(nextStep && !canAct(REPLACEMENT_ROLES[nextStep.key])) return;
    approveReplacementStep(t); saveState(); render(); return;
  }
  if(action==='check-invoice'){
    if(!canAct('logistics')) return;
    const t = findTicket(id); attemptInvoicePull(t); saveState(); render(); return;
  }
  if(action==='override-invoice'){
    if(!canAct('logistics')) return;
    const t = findTicket(id); overrideInvoiceStep(t); saveState(); render(); return;
  }
  if(action==='advance-return'){
    const t = findTicket(id); const r = t.closure.defectiveReturn;
    const nextKey = !r.rpoRaised ? 'rpo' : 'credit_note';
    if(!canAct(RETURN_ROLES[nextKey])) return;
    advanceReturn(t); saveState(); render(); return;
  }
  if(action==='advance-closure'){
    const t = findTicket(id); const c = t.closure; let role;
    if(c.deductionApplied===null) role = c.isReplacementCall ? 'system' : 'technician';
    else if(!c.claimAdjustment) role = 'ho';
    else if(!c.invoiceUnlocked) role = 'branch';
    if(role && !canAct(role)) return;
    advanceClosure(t); saveState(); render(); return;
  }
  if(action==='approve-closure'){
    if(!canAct('ho')) return;
    const t = findTicket(id); approveClosureStep(t, el.dataset.step); saveState(); render(); return;
  }
}
function handleFormAction(e){
  e.preventDefault();
  const form = e.currentTarget; const action = form.dataset.action; const id = form.dataset.id;
  const fd = new FormData(form); const t = findTicket(id);
  if(action==='allocate-branch'){
    if(!canAct('branch')) return;
    t.serviceCentre = fd.get('centre'); addLog(t, 'Branch manually allocated to ' + t.serviceCentre);
  } else if(action==='assign-tech'){
    if(!canAct('branch')) return;
    t.technician = fd.get('tech'); addLog(t, 'Technician assigned: ' + t.technician);
  } else if(action==='book-appt'){
    if(!canAct('branch')) return;
    t.appointment = fd.get('appt'); addLog(t, 'Appointment booked for ' + fd.get('appt'));
  } else if(action==='advance-closure'){ advanceClosure(t, fd);
  } else if(action==='submit-docs-replacement'){
    if(!canAct('asc')) return; submitReplacementDocs(t, fd);
  } else if(action==='reject-replacement'){
    if(!canAct('branch') && !canAct('ho')) return; rejectReplacementStep(t, fd.get('reason'));
  } else if(action==='reject-closure'){
    if(!canAct('ho')) return; rejectClosureStep(t, form.dataset.step, fd.get('reason'));
  }
  saveState(); render();
}

/* ========================= TOAST / INIT ========================= */
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(window._tt); window._tt = setTimeout(()=>el.classList.remove('show'), 2000);
}

function applyLoadBanner(){
  if(!ticketsLoadError || ticketsLoading) return;
  const content = document.getElementById('content');
  const note = document.createElement('div');
  note.className = 'subnote';
  note.textContent = 'Could not refresh tickets from Clappia (' + ticketsLoadError + ').';
  content.prepend(note);
}

async function init(){
  loadState();
  ticketsLoading = true;
  render();
  await syncTicketsFromClappia();
  ticketsLoading = false;
  saveState();
  render();
}
init();
</script>
